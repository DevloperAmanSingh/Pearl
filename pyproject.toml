[project]
name = "pearl-code-review"
version = "0.1.0"
description = "AI-assisted GitHub pull request reviewer"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Aman Singh", email = "aman@example.com" }]
dependencies = [
    "fastapi>=0.111.0,<0.112.0",
    "uvicorn[standard]>=0.29.0,<0.30.0",
    "sqlmodel>=0.0.16,<0.0.17",
    "psycopg[binary]>=3.1.20,<4.0",
    "alembic>=1.13.1,<2.0",
    "celery>=5.4.0,<6.0",
    "redis>=5.0.4,<6.0",
    "httpx>=0.27.0,<0.28.0",
    "python-dotenv>=1.0.1,<2.0",
    "pydantic-settings>=2.3.4,<3.0",
    "uvloop>=0.19.0,<0.20.0",
    "pygithub>=2.3.0,<3.0",
    "tree-sitter>=0.21.2,<0.22.0",
    "pyjwt[crypto]>=2.8.0,<3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.1,<9.0",
    "pytest-asyncio>=0.23.6,<0.24.0",
    "anyio>=4.3.0,<5.0",
    "ruff>=0.4.2,<0.5.0",
    "respx>=0.20.2,<0.21.0",
]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.sdist]
include = ["app", "README.md", "docs", "tests", ".env.example", "pyproject.toml"]
